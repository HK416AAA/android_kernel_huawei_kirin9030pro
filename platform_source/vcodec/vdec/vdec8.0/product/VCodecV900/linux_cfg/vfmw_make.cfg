LINUX_VER := linux
##############################################################
#                      vfmw support config                   #
##############################################################
VFMW_PROC_SUPPORT = n
ifeq ($(CONFIG_VCODEC_DEBUG), y)
VFMW_PROC_SUPPORT = y
endif

# freq config
# vdec clk: 214M、335M、418M、558M、720M
VDEC_CLK_RATE_LEVEL_MAX = 5

# BSP_NUM config
VDH_BSP_NUM = 2

######## whether vdec suspend to reduce power consumption during the idle phase ########
ENABLE_VDEC_POWER_OFF_IN_IDLE = n
ifeq ($(CONFIG_VCODEC_OHOS), y)
ifneq ($(product_type), pc)
ENABLE_VDEC_POWER_OFF_IN_IDLE = y
endif
endif