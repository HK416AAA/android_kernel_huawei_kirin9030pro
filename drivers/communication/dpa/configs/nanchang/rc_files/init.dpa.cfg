{
    "jobs" : [{
            "name": "fs",
            "condition" : "fs",
            "cmds": [
                "write /sys/module/firmware_class/parameters/path /vendor/hisi/dpa/firmware",
                "start dpa_load",
                "start dpa_comm_load",
                "wait /sys/class/remoteproc/remoteproc_dpa/state 30",
                "write /sys/class/remoteproc/remoteproc_dpa/state start"
            ]
        },{
            "name": "post-fs",
            "condition" : "post-fs",
            "cmds": [
                "wait /dev/dpa_fw_record",
                "chown radio radio /dev/dpa_fw_record",
                "wait /dev/dpa_fw_syslog",
                "chown radio radio /dev/dpa_fw_syslog",
                "start udx_server"
            ]
        }
    ],
    "services": [{
        "name": "dpa_load",
        "path": ["/system/bin/insmod", "/vendor/hisi/dpa/module/dpa.ko"],
        "uid": "root",
        "gid": ["root"],
        "once": 1,
        "start-mode": "condition",
        "secon": "u:r:modem_driver:s0"
    }, {
        "name": "udx_server",
        "path": ["/vendor/communication/dpa/bin/udx_server", "/vendor/communication/dpa/config/udx_config.json"],
        "uid": "radio",
        "gid": ["radio"],
        "sandbox": 0,
        "start-mode": "condition",
        "secon": "u:r:udx_server:s0"
    }, {
        "name": "dpa_comm_load",
        "path": ["/system/bin/insmod", "/vendor/communication/dpa/module/dpa.ko"],
        "uid": "root",
        "gid": ["root"],
        "once": 1,
        "start-mode": "condition",
        "secon": "u:r:modem_driver:s0"
    }]
}
