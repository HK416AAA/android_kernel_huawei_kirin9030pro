{
    "jobs" : [{
            "name": "fs && param:ohos.boot.modem_enable=1 && param:ohos.boot.hota.mode=0",
            "condition" : "fs && ohos.boot.modem_enable=1 && ohos.boot.hota.mode=0",
            "cmds": [
                "mount_one_fstab /vendor/etc/fstab.updater /vendor/hisi/dpa 0",
                "mount_one_fstab /vendor/etc/fstab.updater /vendor/communication/dpa 0",
                "write /sys/module/firmware_class/parameters/path /vendor/hisi/dpa/firmware",
                "start dpa_load",
                "write /sys/module/firmware_class/parameters/path /vendor/communication/dpa/firmware",
                "start dpa_comm_load",
                "wait /sys/class/remoteproc/remoteproc_dpa/state 30",
                "write /sys/class/remoteproc/remoteproc_dpa/state start"
            ]
        }
    ],
    "services": [{
        "name": "dpa_load",
        "path": ["/system/bin/insmod", "/vendor/hisi/dpa/module/dpa.ko"],
        "uid": "root",
        "gid": ["root"],
        "once": 1,
        "start-mode": "condition",
        "secon": "u:r:modem_driver:s0"
    }, {
        "name": "dpa_comm_load",
        "path": ["/system/bin/insmod", "/vendor/communication/dpa/module/dpa.ko"],
        "uid": "root",
        "gid": ["root"],
        "once": 1,
        "start-mode": "condition",
        "secon": "u:r:modem_driver:s0"
    }]
}
